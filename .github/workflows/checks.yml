name: Portable checks

# GitHub runners have no Apple Neural Engine, so nothing here executes a device
# suite. These jobs check arithmetic, evidence identity and whether the
# published documents still agree with the bundled records.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .

      - name: Reference and evidence tests
        run: python -m unittest discover -s tests -v

      - name: Recheck the ANE-versus-GPU comparison and the per-call leak
        run: python results/historical/tests/verify_prefill.py

      - name: Recheck the later native MLP follow-up
        run: python results/historical/tests/verify_native_followup.py

      - name: Recompute imported G2 service and thermal observations
        run: python scripts/verify_g2.py

      - name: Recompute G3 complete-model speed and component energy
        run: python scripts/verify_g3.py

      - name: Recompute G1-W quantized speed conditions and the E4B QAT MLP
        run: python scripts/verify_g1w.py

      - name: Recompute G5 attention timings
        run: python scripts/verify_g5.py

      - name: Recompute G4 A matched-graph speed and component energy
        run: python scripts/verify_g4a.py

      - name: Recompute G6 decode query width, W4 and the G4 A repeat
        run: python scripts/verify_g6.py

      - name: Recompute G7 Core ML and Core AI on the same E4B codes
        run: python scripts/verify_g7.py

      - name: Recompute the disk space held by ANECompilerService
        run: python scripts/verify_ane_compiler_disk.py

      - name: Recheck the recorded QDQ multiply outputs
        run: python findings/coreai-qdq-multiply-scale/repro/verify.py

      - name: Recheck the Core ML QDQ multiply outputs and placement
        run: python findings/coreai-qdq-multiply-scale/repro/coreml/verify.py

      - name: Recheck the recorded short decode query outcomes
        run: python findings/ane-short-decode-query/repro/verify.py

      - name: Recheck the recorded palettized placement pair
        run: python findings/coreai-palettized-weights-gpu/repro/verify.py

      - name: Check current source identity against its documented status
        run: python scripts/check_source_identity.py --check

      - name: Recheck the execution model and the localized dot product
        run: python results/historical/tests/verify_arithmetic.py

      - name: Recompute the historical timing records
        run: python results/historical/tests/verify_historical.py

      - name: Recompute the published tables and quoted numbers
        run: python scripts/summarize.py

      - name: Figures regenerate byte-identically
        run: python scripts/render_figures.py --check

<text x="40" y="420" font-size="13" class="t-muted">Decode: G4 A uses teacher-forced requests; G3 uses the first 256 steps of one decode block.</text>
<text x="40" y="439" font-size="13" class="t-muted">Prefill: warmed one-token request blocks. G3 selects its 32K graph from 2K decode / 4K prefill.</text>
<text x="40" y="458" font-size="13" class="t-muted">Rates include host work; they are not hardware ceilings.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="362" viewBox="0 0 900 362" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">FP16 against two quantized paths on a synthetic 128-layer chain</title>
<desc id="fig-desc">Five configurations, each measured in three independent processes. Bars show the median process rate and labels give the full range across the three. Quantized paths reach about 35 T source-equivalent operations per second against about 18.5 for FP16. Source-equivalent operation counts do not establish physical INT8 arithmetic.</desc>

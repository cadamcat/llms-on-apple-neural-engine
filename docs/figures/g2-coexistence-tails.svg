<text x="40" y="621" font-size="10.5" class="t-muted">Memory-access baseline violations were anomalous in both orders; no claim that ANE improves memory performance.</text>
<text x="40" y="637" font-size="10.5" class="t-muted">Fixed offered rates do not measure maximum spare GPU capacity. Ventura effect remains unquantified.</text>

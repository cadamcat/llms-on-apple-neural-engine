<svg xmlns="http://www.w3.org/2000/svg" width="900" height="324" viewBox="0 0 900 324" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">One recorded output, two arithmetic references</title>
<desc id="fig-desc">The same Core AI W8A8 output has a relative L2 of about 0.000109 against the reference selected before the run, which rounds Q8 midpoints away from zero, and about 0.211 against the ties-to-even diagnostic reference. This is a change of reference, not a repair of the output.</desc>

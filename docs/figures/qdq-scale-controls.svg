<svg xmlns="http://www.w3.org/2000/svg" width="900" height="434" viewBox="0 0 900 434" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Exact-grid controls separate a scale error from a rounding error</title>
<desc id="fig-desc">For the exact inputs g equals 2 and u equals 8 the target product is 16, with no midpoint tie and no saturation anywhere. Equal-scale and explicit-quantize controls have zero error; unequal scales give a relative L2 of 0.75 and reversed construction gives 3. All four cases show ANE participation in every control, which does not make them numerically correct.</desc>
<style>text{dominant-baseline:auto}.num{font-variant-numeric:tabular-nums}.b{font-weight:700}.sb{font-weight:600}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.t-bg{fill:#fbfcfd}.f-bg{fill:#fbfcfd}.s-bg{stroke:#fbfcfd}.t-card{fill:#ffffff}.f-card{fill:#ffffff}.s-card{stroke:#ffffff}.t-rule{fill:#e3e8ef}.f-rule{fill:#e3e8ef}.s-rule{stroke:#e3e8ef}.t-grid{fill:#eef2f7}.f-grid{fill:#eef2f7}.s-grid{stroke:#eef2f7}.t-ink{fill:#1f2937}.f-ink{fill:#1f2937}.s-ink{stroke:#1f2937}.t-muted{fill:#65748b}.f-muted{fill:#65748b}.s-muted{stroke:#65748b}.t-slate{fill:#94a3b8}.f-slate{fill:#94a3b8}.s-slate{stroke:#94a3b8}.t-blue{fill:#3b7dd8}.f-blue{fill:#3b7dd8}.s-blue{stroke:#3b7dd8}.t-teal{fill:#0e8a7d}.f-teal{fill:#0e8a7d}.s-teal{stroke:#0e8a7d}.t-amber{fill:#c8791d}.f-amber{fill:#c8791d}.s-amber{stroke:#c8791d}.t-red{fill:#c0524a}.f-red{fill:#c0524a}.s-red{stroke:#c0524a}.t-plum{fill:#7c6bd6}.f-plum{fill:#7c6bd6}.s-plum{stroke:#7c6bd6}.tint-blue{fill:#eff5fd}.tint-teal{fill:#ecf8f6}.tint-amber{fill:#fdf5ea}.tint-red{fill:#fdf0ef}.tint-slate{fill:#f5f7fa}@media (prefers-color-scheme:dark){.t-bg{fill:#0d1117}.f-bg{fill:#0d1117}.s-bg{stroke:#0d1117}.t-card{fill:#161b22}.f-card{fill:#161b22}.s-card{stroke:#161b22}.t-rule{fill:#2f3742}.f-rule{fill:#2f3742}.s-rule{stroke:#2f3742}.t-grid{fill:#242c36}.f-grid{fill:#242c36}.s-grid{stroke:#242c36}.t-ink{fill:#e6edf3}.f-ink{fill:#e6edf3}.s-ink{stroke:#e6edf3}.t-muted{fill:#9aa7b6}.f-muted{fill:#9aa7b6}.s-muted{stroke:#9aa7b6}.t-slate{fill:#8492a3}.f-slate{fill:#8492a3}.s-slate{stroke:#8492a3}.t-blue{fill:#6ea8f0}.f-blue{fill:#6ea8f0}.s-blue{stroke:#6ea8f0}.t-teal{fill:#33b3a4}.f-teal{fill:#33b3a4}.s-teal{stroke:#33b3a4}.t-amber{fill:#e0a44e}.f-amber{fill:#e0a44e}.s-amber{stroke:#e0a44e}.t-red{fill:#e0776d}.f-red{fill:#e0776d}.s-red{stroke:#e0776d}.t-plum{fill:#a394ec}.f-plum{fill:#a394ec}.s-plum{stroke:#a394ec}.tint-blue{fill:#16212f}.tint-teal{fill:#10241f}.tint-amber{fill:#241a10}.tint-red{fill:#241413}.tint-slate{fill:#1b212a}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 1 L8 4.5 L0 8" fill="none" class="s-muted" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="434" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">Exact-grid controls separate a scale error from a rounding error</text>
<text x="40" y="50" font-size="12" class="t-muted">one multiplication, four ways of writing the same graph</text>
<text x="40" y="68" font-size="10.5" class="t-muted">Core AI · Apple M5 Pro · fresh smoke suite · coreai-torch 0.4.1</text>
<rect x="40" y="88" width="250" height="78" rx="8" class="tint-blue s-blue" stroke-width="1" stroke-opacity=".35"/>
<text x="58" y="110" font-size="11.5" class="t-blue sb">g = 2  →  QDQ(scale 0.5)</text>
<text x="58" y="130" font-size="11.5" class="t-blue sb">u = 8  →  QDQ(scale 2)</text>
<text x="58" y="152" font-size="10.5" class="t-muted">Both quantized codes are exactly 4.</text>
<path d="M298 127 L322 127" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="332" y="88" width="188" height="78" rx="8" class="tint-teal s-teal" stroke-width="1" stroke-opacity=".35"/>
<text x="426" y="112" font-size="10.5" class="t-teal sb" text-anchor="middle">Expected product</text>
<text x="426" y="144" font-size="21" class="t-teal b" text-anchor="middle">2 × 8 = 16</text>
<rect x="542" y="88" width="318" height="78" rx="8" class="tint-slate s-slate" stroke-width="1" stroke-opacity=".35"/>
<text x="560" y="110" font-size="11.5" class="t-ink sb">No midpoint ties, no saturation.</text>
<text x="560" y="130" font-size="10.5" class="t-muted">RNE and RZA produce identical codes here.</text>
<text x="560" y="150" font-size="10.5" class="t-muted">Equal-scale case: scales 2, 2 → codes 1, 4.</text>
<text x="58" y="202" font-size="10.5" class="t-muted sb">Graph expression</text>
<text x="392" y="202" font-size="10.5" class="t-muted sb">Scales (g, u)</text>
<text x="560" y="202" font-size="10.5" class="t-muted sb" text-anchor="end">Relative L2</text>
<text x="664" y="202" font-size="10.5" class="t-muted sb" text-anchor="end">Max |error|</text>
<text x="860" y="202" font-size="10.5" class="t-muted sb" text-anchor="end">ANE in all four controls</text>
<path d="M40 212 L860 212" fill="none" class="s-rule" stroke-width="1"/>
<rect x="40" y="222" width="820" height="30" rx="6" class="tint-teal" stroke="none"/>
<text x="58" y="242" font-size="11.5" class="t-ink">Standard QDQ</text>
<text x="392" y="242" font-size="11.5" class="t-ink">2, 2</text>
<text x="560" y="242" font-size="11.5" class="t-teal b num" text-anchor="end">0</text>
<text x="664" y="242" font-size="11.5" class="t-teal b num" text-anchor="end">0</text>
<text x="860" y="242" font-size="11.5" class="t-ink num" text-anchor="end">yes</text>
<rect x="40" y="258" width="820" height="30" rx="6" class="tint-amber" stroke="none"/>
<text x="58" y="278" font-size="11.5" class="t-ink">Standard QDQ</text>
<text x="392" y="278" font-size="11.5" class="t-ink">0.5, 2</text>
<text x="560" y="278" font-size="11.5" class="t-amber b num" text-anchor="end">0.75</text>
<text x="664" y="278" font-size="11.5" class="t-amber b num" text-anchor="end">12</text>
<text x="860" y="278" font-size="11.5" class="t-ink num" text-anchor="end">yes</text>
<rect x="40" y="294" width="820" height="30" rx="6" class="tint-amber" stroke="none"/>
<text x="58" y="314" font-size="11.5" class="t-ink">Reversed branch construction</text>
<text x="392" y="314" font-size="11.5" class="t-ink">0.5, 2</text>
<text x="560" y="314" font-size="11.5" class="t-amber b num" text-anchor="end">3</text>
<text x="664" y="314" font-size="11.5" class="t-amber b num" text-anchor="end">48</text>
<text x="860" y="314" font-size="11.5" class="t-ink num" text-anchor="end">yes</text>
<rect x="40" y="330" width="820" height="30" rx="6" class="tint-teal" stroke="none"/>
<text x="58" y="350" font-size="11.5" class="t-ink">Explicit quantize expression</text>
<text x="392" y="350" font-size="11.5" class="t-ink">0.5, 2</text>
<text x="560" y="350" font-size="11.5" class="t-teal b num" text-anchor="end">0</text>
<text x="664" y="350" font-size="11.5" class="t-teal b num" text-anchor="end">0</text>
<text x="860" y="350" font-size="11.5" class="t-ink num" text-anchor="end">yes</text>
<text x="40" y="396" font-size="11.5" class="t-ink sb">Reversing the order changes how the two branches are built, not the multiplication they target.</text>
<text x="40" y="414" font-size="10.5" class="t-muted">Errors are shown for the original input; the ANE column covers all four controls, original, zero, negative and repeat.</text>
</svg>

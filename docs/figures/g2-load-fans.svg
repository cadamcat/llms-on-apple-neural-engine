<text x="40" y="430" font-size="10.5" class="t-muted">Six equal-rate pairs at 1.6–4.9 requests/s (window means, matched starts); saturated blocks at 6.4 and 23.7 (final five-minute medians, platform rule met).</text>
<text x="40" y="446" font-size="10.5" class="t-muted">The ANE marker is drawn inside the GPU marker; dashed: median block-start fan 0 speed. CPU sensor difference at equal load: 0.7–2.2 °C.</text>
<text x="40" y="462" font-size="10.5" class="t-muted">Fan 1 follows the same pattern: idle 1,459 RPM, 1,457–1,462 at equal load, 3,368–3,768 in saturated GPU blocks.</text>
<text x="40" y="478" font-size="10.5" class="t-muted">Sensor means are not case temperatures; RPM is not acoustic noise. Ventura screensaver reported; energy undetermined.</text>

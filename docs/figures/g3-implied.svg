<text x="40" y="398" font-size="10.5" class="t-muted">Dashed: the same machine's ANE synthetic FP16 chain at 18.8 T ops/s, on one fixed shape.</text>
<text x="40" y="414" font-size="10.5" class="t-muted">Prefill counts two FLOPs per projection weight per token and excludes attention.</text>
<text x="40" y="430" font-size="10.5" class="t-muted">Decode assumes one weight/KV read per step with KV growth; current-token writes and padding excluded.</text>
<text x="40" y="446" font-size="10.5" class="t-muted">Model work divided by measured time; device counters and DRAM traffic were not measured.</text>

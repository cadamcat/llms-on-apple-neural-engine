<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Historical Python MLP: the GPU is 2.9 to 5.1 times faster</title>
<desc id="fig-desc">Historical Python measurement of one first-layer MLP from the same source Q4_0 weights, in positions processed per second. The GPU path runs between 2.9 and 5.1 times faster. The Neural Engine holds about 5,300 positions per second at every measured size; the GPU peaks at 1024 and falls at 4096. Later native results are separate. One process per path, and not an end-to-end prefill.</desc>

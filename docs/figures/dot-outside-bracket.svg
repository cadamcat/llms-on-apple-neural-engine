<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 1 L8 4.5 L0 8" fill="none" class="s-muted" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="322" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">Final rounding of the exact dot cannot explain this output</text>
<text x="40" y="50" font-size="12" class="t-muted">one 32-term dot product from a real gate · the binary16 grid, zoomed to four ULP</text>
<text x="40" y="68" font-size="10.5" class="t-muted">Qwen8B first gate · output channel 11793, token 22 · input channels 2912–2943</text>
<text x="545" y="128" font-size="10.5" class="t-teal sb" text-anchor="middle">any correctly rounded result is one of these two</text>
<rect x="460" y="140" width="170" height="44" rx="6" class="tint-teal" stroke="none"/>
<path d="M120 162 L800 162" fill="none" class="s-rule" stroke-width="1"/>
<path d="M120 155 L120 169" fill="none" class="s-muted" stroke-width="1"/>
<path d="M290 155 L290 169" fill="none" class="s-muted" stroke-width="1"/>
<path d="M460 155 L460 169" fill="none" class="s-muted" stroke-width="1"/>
<path d="M630 155 L630 169" fill="none" class="s-muted" stroke-width="1"/>
<path d="M800 155 L800 169" fill="none" class="s-muted" stroke-width="1"/>
<text x="800" y="188" font-size="10.5" class="t-muted" text-anchor="end">representable binary16 values, 1 ULP apart</text>
<circle cx="290" cy="162" r="7" class="f-red"/>
<path d="M290 171 L290 196" fill="none" class="s-red" stroke-width="1"/>
<text x="290" y="212" font-size="11.5" class="t-red b" text-anchor="middle">✗  what the ANE returned</text>
<text x="290" y="228" font-size="10.5" class="t-muted num" text-anchor="middle">-0.05987548828125</text>
<circle cx="460" cy="162" r="7" class="f-teal"/>
<path d="M460 171 L460 196" fill="none" class="s-teal" stroke-width="1"/>
<text x="460" y="212" font-size="11.5" class="t-teal b" text-anchor="middle">✓  correctly rounded</text>
<text x="460" y="228" font-size="10.5" class="t-muted num" text-anchor="middle">-0.059844970703125</text>
<text x="40" y="268" font-size="10.5" class="t-ink">The exact dot product is -0.059843659400939941, which sits 0.04 ULP above the lower end — indistinguishable from it here, and nowhere near a midpoint.</text>
<text x="40" y="292" font-size="10.5" class="t-muted">Final rounding alone is ruled out; intermediate products and accumulation remain unobserved. Check the 32 published terms.</text>

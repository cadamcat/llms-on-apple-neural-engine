<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Final rounding of the exact dot cannot explain this output</title>
<desc id="fig-desc">The binary16 grid around one exact 32-term dot product. The exact value lies between two representable numbers, so any correctly rounded result must be one of those two. The recorded device output is a third value, one unit in the last place beyond the lower one. This excludes final rounding alone, not intermediate product or accumulation effects.</desc>

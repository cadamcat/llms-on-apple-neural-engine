<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Three questions behind one word: accuracy</title>
<desc id="fig-desc">Runtime compatibility compares a device output with a frozen arithmetic reference. Quantization deviation compares the quantized pipeline with an FP16 baseline. Model quality needs a language or task evaluation. Evidence at one level cannot stand in for the next.</desc>
<style>text{dominant-baseline:auto}.num{font-variant-numeric:tabular-nums}.b{font-weight:700}.sb{font-weight:600}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.t-bg{fill:#fbfcfd}.f-bg{fill:#fbfcfd}.s-bg{stroke:#fbfcfd}.t-card{fill:#ffffff}.f-card{fill:#ffffff}.s-card{stroke:#ffffff}.t-rule{fill:#e3e8ef}.f-rule{fill:#e3e8ef}.s-rule{stroke:#e3e8ef}.t-grid{fill:#eef2f7}.f-grid{fill:#eef2f7}.s-grid{stroke:#eef2f7}.t-ink{fill:#1f2937}.f-ink{fill:#1f2937}.s-ink{stroke:#1f2937}.t-muted{fill:#65748b}.f-muted{fill:#65748b}.s-muted{stroke:#65748b}.t-slate{fill:#94a3b8}.f-slate{fill:#94a3b8}.s-slate{stroke:#94a3b8}.t-blue{fill:#3b7dd8}.f-blue{fill:#3b7dd8}.s-blue{stroke:#3b7dd8}.t-teal{fill:#0e8a7d}.f-teal{fill:#0e8a7d}.s-teal{stroke:#0e8a7d}.t-amber{fill:#c8791d}.f-amber{fill:#c8791d}.s-amber{stroke:#c8791d}.t-red{fill:#c0524a}.f-red{fill:#c0524a}.s-red{stroke:#c0524a}.t-plum{fill:#7c6bd6}.f-plum{fill:#7c6bd6}.s-plum{stroke:#7c6bd6}.tint-blue{fill:#eff5fd}.tint-teal{fill:#ecf8f6}.tint-amber{fill:#fdf5ea}.tint-red{fill:#fdf0ef}.tint-slate{fill:#f5f7fa}@media (prefers-color-scheme:dark){.t-bg{fill:#0d1117}.f-bg{fill:#0d1117}.s-bg{stroke:#0d1117}.t-card{fill:#161b22}.f-card{fill:#161b22}.s-card{stroke:#161b22}.t-rule{fill:#2f3742}.f-rule{fill:#2f3742}.s-rule{stroke:#2f3742}.t-grid{fill:#242c36}.f-grid{fill:#242c36}.s-grid{stroke:#242c36}.t-ink{fill:#e6edf3}.f-ink{fill:#e6edf3}.s-ink{stroke:#e6edf3}.t-muted{fill:#9aa7b6}.f-muted{fill:#9aa7b6}.s-muted{stroke:#9aa7b6}.t-slate{fill:#8492a3}.f-slate{fill:#8492a3}.s-slate{stroke:#8492a3}.t-blue{fill:#6ea8f0}.f-blue{fill:#6ea8f0}.s-blue{stroke:#6ea8f0}.t-teal{fill:#33b3a4}.f-teal{fill:#33b3a4}.s-teal{stroke:#33b3a4}.t-amber{fill:#e0a44e}.f-amber{fill:#e0a44e}.s-amber{stroke:#e0a44e}.t-red{fill:#e0776d}.f-red{fill:#e0776d}.s-red{stroke:#e0776d}.t-plum{fill:#a394ec}.f-plum{fill:#a394ec}.s-plum{stroke:#a394ec}.tint-blue{fill:#16212f}.tint-teal{fill:#10241f}.tint-amber{fill:#241a10}.tint-red{fill:#241413}.tint-slate{fill:#1b212a}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 1 L8 4.5 L0 8" fill="none" class="s-muted" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="470" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">Three questions behind one word: accuracy</text>
<text x="40" y="50" font-size="12" class="t-muted">different references answer different questions, and none of them substitutes for the next</text>
<rect x="40" y="88" width="820" height="92" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 96 v76" class="s-teal" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="110" font-size="12.5" class="t-teal b">01 · Runtime compatibility</text>
<text x="56" y="132" font-size="11.5" class="t-ink">Does the declared quantized computation match what the runtime actually did?</text>
<text x="56" y="153" font-size="10.5" class="t-muted">Observed directly in the synthetic fixtures; the scope is exactly the frozen reference.</text>
<rect x="520" y="116" width="148" height="30" rx="6" class="tint-teal" stroke="none"/>
<text x="594" y="135" font-size="10.5" class="t-teal sb" text-anchor="middle">Device output</text>
<text x="680" y="135" font-size="10.5" class="t-muted" text-anchor="middle">vs</text>
<rect x="692" y="116" width="168" height="30" rx="6" class="tint-slate" stroke="none"/>
<text x="776" y="135" font-size="10.5" class="t-ink" text-anchor="middle">Frozen arithmetic reference</text>
<rect x="40" y="194" width="820" height="92" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 202 v76" class="s-blue" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="216" font-size="12.5" class="t-blue b">02 · Quantization deviation</text>
<text x="56" y="238" font-size="11.5" class="t-ink">How far did quantization move the result away from the float baseline?</text>
<text x="56" y="259" font-size="10.5" class="t-muted">A close reference match and a large FP16 difference can hold at the same time.</text>
<rect x="520" y="222" width="148" height="30" rx="6" class="tint-blue" stroke="none"/>
<text x="594" y="241" font-size="10.5" class="t-blue sb" text-anchor="middle">Quantized output</text>
<text x="680" y="241" font-size="10.5" class="t-muted" text-anchor="middle">vs</text>
<rect x="692" y="222" width="168" height="30" rx="6" class="tint-slate" stroke="none"/>
<text x="776" y="241" font-size="10.5" class="t-ink" text-anchor="middle">FP16 baseline</text>
<rect x="40" y="300" width="820" height="92" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 308 v76" class="s-amber" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="322" font-size="12.5" class="t-amber b">03 · Model or task quality</text>
<text x="56" y="344" font-size="11.5" class="t-ink">What happens to NLL, KL or any downstream task metric?</text>
<text x="56" y="365" font-size="10.5" class="t-muted">Not established by these model-free chains. It needs a separate experiment.</text>
<rect x="520" y="328" width="148" height="30" rx="6" class="tint-amber" stroke="none"/>
<text x="594" y="347" font-size="10.5" class="t-amber sb" text-anchor="middle">Quantized model</text>
<text x="680" y="347" font-size="10.5" class="t-muted" text-anchor="middle">vs</text>
<rect x="692" y="328" width="168" height="30" rx="6" class="tint-slate" stroke="none"/>
<text x="776" y="347" font-size="10.5" class="t-ink" text-anchor="middle">Language or task evaluation</text>
<rect x="40" y="406" width="820" height="46" rx="8" class="tint-blue s-blue" stroke-width="1" stroke-opacity=".35"/>
<text x="58" y="426" font-size="11.5" class="t-blue sb">Choosing RNE or RZA changes the comparison, never the output that was recorded.</text>
<text x="58" y="443" font-size="10.5" class="t-muted">Freeze a new hypothesis and its held-out inputs before it is used in a new device experiment.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Reproduce a run, then verify and select its evidence</title>
<desc id="fig-desc">The public CLI prepares a locked environment, inspects it, runs one suite serially behind a resource guard into a new output directory, verifies hashes and source identity, then reports a selection for review. Fresh and historical evidence stay in separate trees.</desc>
<style>text{dominant-baseline:auto}.num{font-variant-numeric:tabular-nums}.b{font-weight:700}.sb{font-weight:600}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.t-bg{fill:#fbfcfd}.f-bg{fill:#fbfcfd}.s-bg{stroke:#fbfcfd}.t-card{fill:#ffffff}.f-card{fill:#ffffff}.s-card{stroke:#ffffff}.t-rule{fill:#e3e8ef}.f-rule{fill:#e3e8ef}.s-rule{stroke:#e3e8ef}.t-grid{fill:#eef2f7}.f-grid{fill:#eef2f7}.s-grid{stroke:#eef2f7}.t-ink{fill:#1f2937}.f-ink{fill:#1f2937}.s-ink{stroke:#1f2937}.t-muted{fill:#65748b}.f-muted{fill:#65748b}.s-muted{stroke:#65748b}.t-slate{fill:#94a3b8}.f-slate{fill:#94a3b8}.s-slate{stroke:#94a3b8}.t-blue{fill:#3b7dd8}.f-blue{fill:#3b7dd8}.s-blue{stroke:#3b7dd8}.t-teal{fill:#0e8a7d}.f-teal{fill:#0e8a7d}.s-teal{stroke:#0e8a7d}.t-amber{fill:#c8791d}.f-amber{fill:#c8791d}.s-amber{stroke:#c8791d}.t-red{fill:#c0524a}.f-red{fill:#c0524a}.s-red{stroke:#c0524a}.t-plum{fill:#7c6bd6}.f-plum{fill:#7c6bd6}.s-plum{stroke:#7c6bd6}.tint-blue{fill:#eff5fd}.tint-teal{fill:#ecf8f6}.tint-amber{fill:#fdf5ea}.tint-red{fill:#fdf0ef}.tint-slate{fill:#f5f7fa}@media (prefers-color-scheme:dark){.t-bg{fill:#0d1117}.f-bg{fill:#0d1117}.s-bg{stroke:#0d1117}.t-card{fill:#161b22}.f-card{fill:#161b22}.s-card{stroke:#161b22}.t-rule{fill:#2f3742}.f-rule{fill:#2f3742}.s-rule{stroke:#2f3742}.t-grid{fill:#242c36}.f-grid{fill:#242c36}.s-grid{stroke:#242c36}.t-ink{fill:#e6edf3}.f-ink{fill:#e6edf3}.s-ink{stroke:#e6edf3}.t-muted{fill:#9aa7b6}.f-muted{fill:#9aa7b6}.s-muted{stroke:#9aa7b6}.t-slate{fill:#8492a3}.f-slate{fill:#8492a3}.s-slate{stroke:#8492a3}.t-blue{fill:#6ea8f0}.f-blue{fill:#6ea8f0}.s-blue{stroke:#6ea8f0}.t-teal{fill:#33b3a4}.f-teal{fill:#33b3a4}.s-teal{stroke:#33b3a4}.t-amber{fill:#e0a44e}.f-amber{fill:#e0a44e}.s-amber{stroke:#e0a44e}.t-red{fill:#e0776d}.f-red{fill:#e0776d}.s-red{stroke:#e0776d}.t-plum{fill:#a394ec}.f-plum{fill:#a394ec}.s-plum{stroke:#a394ec}.tint-blue{fill:#16212f}.tint-teal{fill:#10241f}.tint-amber{fill:#241a10}.tint-red{fill:#241413}.tint-slate{fill:#1b212a}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 1 L8 4.5 L0 8" fill="none" class="s-muted" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="700" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">Reproduce a run, then verify and select its evidence</text>
<text x="40" y="50" font-size="12" class="t-muted">no model download · a new output directory for every run · every stage is separable</text>
<rect x="40" y="88" width="820" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 96 v56" class="s-blue" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="110" font-size="12.5" class="t-blue b">1 · Prepare the locked environment</text>
<text x="56" y="129" font-size="11.5" class="t-ink sb mono">uv sync --locked --extra apple</text>
<text x="56" y="148" font-size="10.5" class="t-muted">Add --offline against a populated cache. Record host, OS, SDK, dependencies and source.</text>
<path d="M450 160 L450 176" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="176" width="820" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 184 v56" class="s-blue" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="198" font-size="12.5" class="t-blue b">2 · Inspect before running</text>
<text x="56" y="217" font-size="11.5" class="t-ink sb mono">ane-scope doctor  ·  ane-scope list</text>
<text x="56" y="236" font-size="10.5" class="t-muted">Confirm what the environment offers, then pick smoke, compatibility, throughput or split.</text>
<path d="M450 248 L450 264" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="264" width="820" height="90" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 272 v74" class="s-teal" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="286" font-size="12.5" class="t-teal b">3 · Execute through the guard</text>
<text x="56" y="305" font-size="11.5" class="t-ink sb mono">ane-scope run --suite smoke --output runs/my-smoke</text>
<text x="56" y="324" font-size="10.5" class="t-muted">Serial execution behind a host lock, with sampled RSS, pressure, disk, swap and time limits.</text>
<text x="56" y="340" font-size="10.5" class="t-muted">Export → asset audit → controls → admitted timing, and timing only for performance suites.</text>
<path d="M450 354 L450 370" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="820" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 378 v56" class="s-teal" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="392" font-size="12.5" class="t-teal b">4 · Verify the run and its source identity</text>
<text x="56" y="411" font-size="11.5" class="t-ink sb mono">ane-scope verify runs/my-smoke</text>
<text x="56" y="430" font-size="10.5" class="t-muted">Recheck hashes, references, placement windows and statistics; read source_matches_run.</text>
<path d="M450 442 L450 458" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="458" width="820" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 466 v56" class="s-blue" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="480" font-size="12.5" class="t-blue b">5 · Report, inspect, then copy</text>
<text x="56" y="499" font-size="11.5" class="t-ink sb mono">ane-scope report runs/my-smoke</text>
<text x="56" y="518" font-size="10.5" class="t-muted">A report plus public-results.json. Inspect the selection before it reaches results/fresh/.</text>
<path d="M450 530 L450 550" fill="none" class="s-muted" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="390" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M41 558 v56" class="s-teal" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="572" font-size="12.5" class="t-teal b">Fresh evidence</text>
<text x="56" y="591" font-size="11.5" class="t-ink">Selected records live in results/fresh/.</text>
<text x="56" y="607" font-size="11.5" class="t-ink">Raw artifacts stay in the ignored runs/ tree.</text>
<rect x="470" y="550" width="390" height="72" rx="8" class="f-card s-rule" stroke-width="1"/>
<path d="M471 558 v56" class="s-amber" stroke-width="3" stroke-linecap="round"/>
<text x="486" y="572" font-size="12.5" class="t-amber b">Historical imports stay apart</text>
<text x="486" y="591" font-size="11.5" class="t-ink">Existing evidence lives in results/historical/.</text>
<text x="486" y="607" font-size="11.5" class="t-ink">Original provenance and hashes are preserved.</text>
<text x="40" y="654" font-size="10.5" class="t-muted">Offline tests and table recalculation check arithmetic and identity. They are not a fresh device run.</text>
</svg>

<rect width="900" height="348" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">Splitting the same K512 weights into sixteen K32 convolutions</text>
<text x="40" y="50" font-size="12" class="t-muted">each line joins one paired round · synchronous prediction p50 in milliseconds, lower is faster</text>
<text x="40" y="68" font-size="10.5" class="t-muted">Apple M5 Pro · two layers, input [1, 512, 64, 64] · same initial weight values on both paths</text>

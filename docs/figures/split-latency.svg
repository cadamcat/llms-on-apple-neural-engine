<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">Splitting the same K512 weights into sixteen K32 convolutions</title>
<desc id="fig-desc">Three paired rounds of a two-layer Core AI A8W4 graph. The wide path takes about 0.43 to 0.45 milliseconds and the split path about 1.76 to 1.77, a ratio near four. Lines join the two arms of one paired round, not a trend over time.</desc>

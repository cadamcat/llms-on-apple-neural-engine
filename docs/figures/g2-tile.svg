<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="fig-title">G2: paired tile diagnostic</title>
<desc id="fig-desc">At 1024 positions, tile 64 and tile 256 run in the same native host in each of three rounds.</desc>

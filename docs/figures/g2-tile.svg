<rect width="900" height="360" class="f-bg"/>
<text x="40" y="30" font-size="17" class="t-ink b">A larger ANE tile helps within the same host</text>
<text x="40" y="50" font-size="12" class="t-muted">N1024 diagnostic · tile 64 versus tile 256 · three separate hosts</text>
<text x="40" y="68" font-size="10.5" class="t-muted">Pairs overlap at this scale; individual ratios are shown. The main tile policy remains fixed.</text>
<text x="165" y="106" font-size="12" class="t-ink sb">MLP positions/s</text>
